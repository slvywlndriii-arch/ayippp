<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Ayip 💖</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ffd6e7,#ffb6d9);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow-y:auto;
overflow-x:hidden;
text-align:center;
padding:20px;
}

.card{
background:white;
padding:30px;
border-radius:25px;
max-width:600px;
max-height:90vh;
overflow-y:auto;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
animation:fade .5s;
}

h1{
color:#ff4f8b;
margin-bottom:15px;
}

p{
font-size:18px;
color:#555;
line-height:1.6;
}

button{
margin-top:20px;
padding:14px 30px;
border:none;
border-radius:50px;
background:#ff4f8b;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

.gallery{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
margin-top:20px;
}

.gallery img{
width:150px;
height:150px;
object-fit:cover;
border-radius:15px;
}

@keyframes fade{
from{
opacity:0;
transform:scale(.8);
}
to{
opacity:1;
transform:scale(1);
}
}

.heart{
position:absolute;
font-size:20px;
animation:fly 6s linear infinite;
}

@keyframes fly{
0%{
transform:translateY(100vh);
opacity:1;
}
100%{
transform:translateY(-100px);
opacity:0;
}
}
</style>
</head>

<body>

<div class="card" id="box">
<h1>aloo sayanggg 💖</h1>
<p>Aku ada sesuatu untuk kamu 🎁</p>
<button onclick="nextStep()">mana?</button>
</div>

<script>

const steps = [

{

},

{

},

{

},

{

},

{

{

text:"kamu siap senyum senyum sendiri gaa?",

}

let current = 0;
let sayangCounter =0;

function jawabEngga(){

sayangCounter++;

if(sayangCounter == 1){

document.getElementById("box").innerHTML = `
<h1>🤨 Yakin?</h1>
<p>Masa engga sih?</p>

<button onclick="nextStep()">
❤️ Iya
</button>

<button onclick="jawabEngga()">
😒 Engga
</button>
`;

}

else if(sayangCounter == 2){

document.getElementById("box").innerHTML = `

<p>Coba pikir lagi deh...</p>

<button onclick="nextStep()">
❤️ iya
</button>

<button onclick="jawabEngga()">
😒 engga
</button>
`;

}

else{

<p>Server tidak menerima jawaban tersebut.</p>

<button onclick="nextStep()">
❤️ Oke Aku Sayang
</button>
`;

}

function nextStep(){

if(current < steps.length){

if(steps[current].title === "kamu sayang aku ga? 🥺"){

document.getElementById("box").innerHTML = `
<h1>${steps[current].title}</h1>
<p>${steps[current].text}</p>

<button onclick="nextStep()">
❤️ banget
</button>

<button onclick="jawabEngga()">
😒 engga
</button>
`;

current++;
return;

}

document.getElementById("box").innerHTML = `
<h1>${steps[current].title}</h1>
<p>${steps[current].text}</p>
<button onclick="nextStep()">${steps[current].btn}</button>
`;

current++;

}else{

showGift();

}

}

function showGift(){

document.getElementById("box").innerHTML = `

<h1>🎉 HAPPY BIRTHDAY SAYANGGGG 🎉</h1>

<p>

<br><br>

Semoga di umur yang baru ini banyak hal baik yang datang ke hidup kamu, timakasi yaa sudah mau turunin egonya kalo berantem. maaf juga aku banyak marah marahnyaaa. terimakasi banyak banyak kamu mau nemenin hari aku walaupun dari jauh. aku gabisa longtekss, tapi aku coba buat ini, keren ga akuuu. mwehehehe
<br><br>

kamu jangan sering sering begadang yaa
jangan bandel kalo dibilangin
Kalau capek istirahat.

<br><br>

OIYAAA timakasi udah mau bagi waktunya sama aku yaaa.

aku sayangg kamuu
lovee youu sayangg
mwahh

<br><br>

💌 Dari akuu

</p>

<div class="gallery">
<img src="foto1.jpeg">
<img src="foto2.jpeg">

function startHearts(){

setInterval(()=>{

const heart=document.createElement("div");

heart.className="heart";
heart.innerHTML="💖";

heart.style.left=Math.random()*100+"vw";

document.body.appendChild(heart);

heart.remove();
},6000);

}

</script>

</body>
</html>
